name: Ancient Seal ROM preview

on:
  push:
    branches: [feature/ancient-seal-prologue]
    paths:
      - 'disasm/**'
      - 'rom/sf2.bin'
      - 'tools/ancient_seal/**'
      - '.github/workflows/ancient-seal-rom-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native Genesis ROM and validate header
        run: python tools/ancient_seal/build-native.py
      - name: Upload playable preview candidate
        uses: actions/upload-artifact@v4
        with:
          name: ancient-seal-preview
          path: |
            build/ancient-seal-preview.bin
            build/ancient-seal-preview.sha256
          if-no-files-found: error
      - name: Upload assembly diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ancient-seal-assembly-diagnostics
          path: |
            build/ancient-seal-preview.lst
            build/ancient-seal-preview.sym
          if-no-files-found: ignore
